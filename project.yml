name: KeyboardApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  KeyboardShared:
    path: Packages/KeyboardShared

targets:
  KeyboardApp:
    type: application
    platform: iOS
    sources:
      - path: KeyboardApp
        excludes:
          - Info.plist
          - KeyboardApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyboardapp
        PRODUCT_NAME: KeyboardApp
        INFOPLIST_FILE: KeyboardApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyboardApp/KeyboardApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: KeyboardExtension
        embed: true
      - package: KeyboardShared

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - Info.plist
          - KeyboardExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyboardapp.keyboard
        PRODUCT_NAME: KeyboardExtension
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/KeyboardExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: KeyboardShared

schemes:
  KeyboardApp:
    build:
      targets:
        KeyboardApp: all
        KeyboardExtension: all
    run:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
      orderHint: 0
  KeyboardExtension:
    build:
      targets:
        KeyboardExtension: all
        KeyboardApp: all
    run:
      config: Debug
      askForAppToLaunch: true
    management:
      shared: true
      orderHint: 1
